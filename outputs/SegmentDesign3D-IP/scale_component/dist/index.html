<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {box-sizing:border-box; letter-spacing:0;}
    html, body {margin:0; background:#fff; color:#20272b; font:14px/1.45 system-ui,sans-serif;}
    #workspace {display:grid; grid-template-columns:minmax(210px,280px) minmax(0,1fr); gap:18px; min-width:0;}
    .controls, .view {min-width:0;}
    .tools {display:flex; align-items:center; gap:6px; height:36px; margin-bottom:8px;}
    button {width:32px; height:32px; padding:6px; display:grid; place-items:center; border:1px solid #dce2e4; border-radius:4px; background:#fff; color:#3d5358; cursor:pointer;}
    button:hover {background:#edf5f3;}
    button:focus-visible, input:focus-visible {outline:2px solid #13776c; outline-offset:2px;}
    button svg {width:18px; height:18px;}
    #sliders {max-height:456px; overflow:auto; padding:0 8px 0 0;}
    .part {padding:12px 0 14px; border-bottom:1px solid #edf0f1;}
    .part:first-child {padding-top:0;}
    .part-heading {display:grid; grid-template-columns:10px minmax(0,1fr) 56px; align-items:start; gap:8px; min-height:28px; position:sticky; top:0; background:white; z-index:1;}
    .swatch {width:9px; height:9px; border-radius:2px; margin-top:6px;}
    .part-name {font-weight:550; overflow-wrap:anywhere; min-width:0;}
    output {text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
    .part.empty {opacity:0.55;}
    .empty-label {font-size:12px; color:#68767a;}
    input[type=range] {display:block; width:100%; margin:8px 0 3px; accent-color:#13776c; cursor:pointer; height:24px; touch-action:pan-y;}
    input:disabled {cursor:not-allowed;}
    .endpoints {display:flex; justify-content:space-between; color:#7b8589; font-size:11px; font-variant-numeric:tabular-nums;}
    .translation {margin-top:10px; --axis-color:#a94747;}
    .translation[data-axis=Y] {--axis-color:#287b52;}
    .translation[data-axis=Z] {--axis-color:#356db0;}
    .translation-heading {display:flex; justify-content:space-between; gap:8px; font-size:12px;}
    .translation-heading label {color:var(--axis-color); font-weight:550;}
    .translation input[type=range] {margin:3px 0 0; height:20px; accent-color:var(--axis-color);}
    #viewport {height:500px; min-width:0; width:100%; position:relative; overflow:hidden; background:#f8fafb;}
    canvas {display:block; width:100%; height:100%; touch-action:none;}
    #error {padding:12px; color:#a52f3c; overflow-wrap:anywhere;}
    #compatibility {font-size:12px; line-height:1.6; color:#795020; margin:0 0 10px;}
    @media(max-width:620px) {
      #workspace {grid-template-columns:minmax(0,1fr); gap:10px;}
      #sliders {max-height:260px;}
      #viewport {height:360px;}
      .part {padding:8px 0;}
    }
  </style>
</head>
<body>
  <main id="workspace">
    <section class="controls" aria-label="パーツごとの倍率と移動">
      <div class="tools">
        <button id="reset" title="編集を初期化" aria-label="編集を初期化"><i data-lucide="rotate-ccw"></i></button>
        <button id="fit" title="全体を表示" aria-label="全体を表示"><i data-lucide="focus"></i></button>
      </div>
      <p id="compatibility" role="status" hidden></p>
      <div id="sliders"></div>
    </section>
    <section class="view" aria-label="編集モデル">
      <div id="viewport"></div>
      <div id="error" role="alert" hidden></div>
    </section>
  </main>
  <script type="module" src="./editor.js?v=79184a023a9b"></script>
</body>
</html>
